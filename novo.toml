[package]
name        = "robots-nv"
version     = "0.1.0"
description = "RFC 9309 as a pure decision: the robots.txt grammar parsed into groups, the longest-match rule with `*` and `$`, groups merged by user-agent token, the unavailable and unreachable status policies, and crawl-delay and sitemap read as the extensions they are."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  Every function answers a question about two strings the
# caller already holds: a robots.txt file and a path.  Fetching the
# file is the caller's `[net]`, and so is obeying a crawl delay.
# RFC 9309's own rules are a decision, and a decision has no effect.
# The status policies of section 2.3.1 are here as pure functions from
# a status code, because the policy is the specification's and the
# request is the caller's.
layer       = "core"

category    = "web"

tags        = ["robots", "robots-txt", "rfc-9309", "crawler", "user-agent", "web"]
repository  = "https://github.com/novolang/robots-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "RFC 9309, as a decision over a path and an agent name"

[dependencies]
# None.  Two dependencies look obvious and neither is used.
#
# glob-nv would be wrong: a robots.txt path pattern is not a glob.
# RFC 9309 section 2.2.3 gives `*` and `$` and nothing else: no `?`, no
# character class, no `**`, and `*` crosses a `/` freely, which is the
# opposite of what a glob means.
#
# url-nv would be wrong too: section 2.2.2 compares the path and query
# of a URL octet by octet after a fixed percent-encoding step, and does
# not parse or otherwise normalise it.  That step is a few lines here.
